syntax = "proto3";

import "com/bowoon/surfy/data/dark_theme_config.proto";

option java_package = "com.bowoon.surfy.core.datastore";
option java_multiple_files = true;

message InternalDataPreferences {
  string fcmToken = 1;
  bool isAdult = 2;
  bool isAutoPlayTrailer = 3;
  DarkThemeConfigProto darkMode = 4;
  string updateDate = 5;
  string region = 6;
  string language = 7;
  string imageQuality = 8;
  string showNextReleaseMoviesDate = 9;
  string secureBaseUrl = 10;
  bool isFirstInstall = 11;
  uint64 workScheduleTime = 12;
  bool isCheatActive = 13;
}